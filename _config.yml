# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: DAYLY CRYSTEL PUC POOT
description: > # blog personal "baseurl:"
  Material theme based on <a href="http://materializecss.com">Materialize.css</a> for jekyll sites
baseurl: "/"
url: "https://dayly-ppoot28.github.io"
permalink: /:year/:month/:day/:title
repository: ShawnTeoh/matjek
paginate: 5

# MatJek specific configurations
github_profile: "https://github.com/ShawnTeoh"
user: "dayly-ppoot28"
user_email: "250300522@ucaribe.edu.mx.com"
contact_url: "https://goo.gl/tVljbV"
google_tracking_id: "UA-96359860-1"
google_site_verification: "UA-96359860-1"
disqus_shortname: "Dayly"

# Build settings
markdown: kramdown
gems:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
sass:
  style: compressed
future: true
